name: Maintainer release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New demonstration release tag (e.g. v0.6.1-databricks.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: patientra-release
  cancel-in-progress: false

jobs:
  release:
    if: github.actor == 'DevDataMLOps' && github.triggering_actor == 'DevDataMLOps' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os, re
          assert re.fullmatch(r'v0\.6\.1-databricks\.[1-9][0-9]*', os.environ['RELEASE_TAG']), 'Invalid release tag'
          PY
      - name: Install and test
        run: |
          python -m pip install -r requirements.txt build
          python -m pytest -q
          python -m build --wheel
      - name: Build integrity evidence
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          Path('dist/release-evidence.json').write_text(json.dumps({
            'source_commit': os.environ['GITHUB_SHA'],
            'status': 'DEMONSTRATION_ONLY',
            'databricks_execution_verified': False,
            'artifacts': {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('dist').glob('*.whl')}
          }, indent=2) + '\n')
          PY
      - name: Publish demonstration package release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.whl dist/release-evidence.json --target "$GITHUB_SHA" --prerelease --title "PATIENTRA $RELEASE_TAG" --notes "Validated package release for the Databricks Medallion integration. Phase 10 remains demonstration-only. Workspace execution evidence is separate from package validation."
