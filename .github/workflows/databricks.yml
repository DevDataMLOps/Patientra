name: Maintainer Databricks execution

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [dev, prod]
        default: dev
        required: true
      observation_end:
        type: string
        default: '2025-12-31'
        required: true

permissions:
  contents: read

concurrency:
  group: patientra-databricks
  cancel-in-progress: false

jobs:
  execute:
    if: github.actor == 'DevDataMLOps' && github.triggering_actor == 'DevDataMLOps' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: databricks-${{ inputs.target }}
    env:
      DATABRICKS_HOST: https://dbc-c4f30ab9-7317.cloud.databricks.com
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      BUNDLE_VAR_source_commit: ${{ github.sha }}
      BUNDLE_VAR_observation_end: ${{ inputs.observation_end }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate contracts before deployment
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q
      - uses: databricks/setup-cli@9230f12203ef173d0b901846f62a55ce997efef7
        with:
          version: '1.19.0'
      - name: Validate, deploy, and execute
        env:
          TARGET: ${{ inputs.target }}
        run: |
          databricks bundle validate -t "$TARGET"
          databricks bundle deploy -t "$TARGET"
          databricks bundle run -t "$TARGET" medallion
