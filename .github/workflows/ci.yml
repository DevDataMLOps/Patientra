name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Compile source
        run: python -m compileall -q src tests

      - name: Run test suite
        run: python -m pytest -q

  bundle-schema:
    name: Databricks bundle schema
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: databricks/setup-cli@9230f12203ef173d0b901846f62a55ce997efef7
        with:
          version: '1.19.0'
      - name: Validate against the official CLI schema
        run: |
          python -m pip install PyYAML jsonschema regex
          databricks bundle schema > bundle-schema.json
          python scripts/check_bundle.py bundle-schema.json
