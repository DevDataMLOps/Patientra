name: Bug report
description: Report a reproducible defect without sharing patient or sensitive data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach hospital data, identifiers, secrets, screenshots of protected records, or unsuppressed outputs.
  - type: dropdown
    id: phase
    attributes:
      label: Pipeline phase
      options:
        - Phase 1 — Bronze ingestion
        - Phase 2 — Silver cleaning
        - Phase 3 — Identity resolution
        - Phase 4 — Gold features
        - Phase 5 — Analytics
        - Phase 6 — Validation
        - Documentation or CI
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior using synthetic or aggregate examples only.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: Include the command and a minimal synthetic input when possible.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, Python 3.11.9
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I confirm this issue contains no patient-level data, identifiers, secrets, or protected screenshots.
          required: true
