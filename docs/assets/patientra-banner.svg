<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">PATIENTRA governed healthcare data pipeline</title>
  <desc id="desc">A navy and teal banner showing protected hospital records flowing through Bronze, Silver, Identity, Gold, Analytics, and Validation stages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071B33"/>
      <stop offset="1" stop-color="#123B56"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="280" rx="24" fill="url(#bg)"/>
  <circle cx="1080" cy="-10" r="180" fill="#1D4ED8" opacity="0.12"/>
  <circle cx="1180" cy="230" r="150" fill="#14B8A6" opacity="0.12"/>
  <g transform="translate(56 48)">
    <rect x="0" y="0" width="76" height="76" rx="18" fill="url(#accent)" filter="url(#shadow)"/>
    <path d="M38 16v44M16 38h44" stroke="#071B33" stroke-width="11" stroke-linecap="round"/>
    <path d="M12 92h288" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <text x="0" y="148" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="3">PATIENTRA</text>
    <text x="2" y="181" fill="#BAE6FD" font-family="Arial, sans-serif" font-size="20">Trusted patient data. Defensible readmission intelligence.</text>
  </g>
  <g transform="translate(545 74)" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">
    <path d="M65 48H515" stroke="#5EEAD4" stroke-width="3" opacity="0.65"/>
    <g fill="#0F766E" stroke="#99F6E4" stroke-width="2">
      <rect x="0" y="18" width="112" height="60" rx="13"/>
      <rect x="132" y="18" width="112" height="60" rx="13"/>
      <rect x="264" y="18" width="112" height="60" rx="13"/>
      <rect x="396" y="18" width="112" height="60" rx="13"/>
    </g>
    <g fill="#F0FDFA" font-weight="700">
      <text x="56" y="44">BRONZE</text><text x="56" y="62" font-weight="400">preserve</text>
      <text x="188" y="44">SILVER</text><text x="188" y="62" font-weight="400">govern</text>
      <text x="320" y="44">IDENTITY</text><text x="320" y="62" font-weight="400">resolve</text>
      <text x="452" y="44">GOLD</text><text x="452" y="62" font-weight="400">feature</text>
    </g>
    <g transform="translate(60 112)">
      <rect x="0" y="0" width="180" height="58" rx="14" fill="#1D4ED8" stroke="#93C5FD" stroke-width="2"/>
      <text x="90" y="25" fill="#EFF6FF" font-weight="700">ANALYTICS</text>
      <text x="90" y="43" fill="#DBEAFE">suppress + quantify</text>
      <rect x="220" y="0" width="180" height="58" rx="14" fill="#7C3AED" stroke="#D8B4FE" stroke-width="2"/>
      <text x="310" y="25" fill="#FAF5FF" font-weight="700">VALIDATION</text>
      <text x="310" y="43" fill="#F3E8FF">verify before release</text>
      <path d="M181 29h38" stroke="#C4B5FD" stroke-width="3"/>
    </g>
  </g>
</svg>
