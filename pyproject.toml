[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patientra"
version = "0.6.1"
description = "Validated Bronze-to-Gold data and aggregate readmission analytics for PATIENTRA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
keywords = ["data-engineering", "healthcare", "identity-resolution", "readmission", "data-quality"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/DevDataMLOps/Patientra"
Repository = "https://github.com/DevDataMLOps/Patientra"
Issues = "https://github.com/DevDataMLOps/Patientra/issues"
Documentation = "https://github.com/DevDataMLOps/Patientra/tree/main/docs"

[project.optional-dependencies]
api = ["fastapi>=0.115,<1.0", "uvicorn>=0.30,<1.0", "pydantic>=2.9,<3.0"]
ml = ["scikit-learn==1.7.2"]

[project.scripts]
patientra-ingest = "patientra.ingestion.ingest:main"
patientra-profile = "patientra.profiling:main"
patientra-silver = "patientra.transformations.silver:main"
patientra-match = "patientra.matching.identity:main"
patientra-gold = "patientra.features.gold:main"
patientra-analytics = "patientra.analytics.readmission:main"
patientra-validate = "patientra.validation.release:main"
patientra-mvp = "patientra.mvp.core:main"
patientra-serve = "patientra.serving.store:main"
patientra-api = "patientra.api.app:main"
patientra-api-cloud = "patientra.api.app:cloud_main"
patientra-export-release = "patientra.api.bundle:main"
patientra-ml = "patientra.ml.readmission:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"patientra.api" = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
