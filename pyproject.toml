[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patientra"
version = "0.6.0"
description = "Validated Bronze-to-Gold data and aggregate readmission analytics for PATIENTRA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
patientra-ingest = "patientra.ingestion.ingest:main"
patientra-profile = "patientra.profiling:main"
patientra-silver = "patientra.transformations.silver:main"
patientra-match = "patientra.matching.identity:main"
patientra-gold = "patientra.features.gold:main"
patientra-analytics = "patientra.analytics.readmission:main"
patientra-validate = "patientra.validation.release:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
