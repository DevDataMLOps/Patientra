[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patientra"
version = "0.1.0"
description = "Phase 1 Bronze ingestion starter for the PATIENTRA hackathon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
patientra-ingest = "patientra.ingestion.ingest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
